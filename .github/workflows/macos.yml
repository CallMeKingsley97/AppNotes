name: Build macOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build and package DMG
        run: ./package.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppNotes-macOS
          path: Build/*.dmg
          if-no-files-found: error

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Build/*.dmg --title "$GITHUB_REF_NAME" --generate-notes
